; Smart veggies firmware (field node + gateway)
;
; Applications:   pio run -e node | node-sim | gateway   [-t upload -t monitor]
; Module bring-up firmwares (see ../docs/phase1-bringup.md):
;   ./scripts/test.sh <lora_range|soil|flow|valves|climate> [serial-port]
;   ./scripts/test.sh build-all
;
; Host unit tests (pure logic, no board needed):
;   pio test -e native

[platformio]
default_envs = test

; ------------------------------------------------------------ shared ESP32 base
[esp32]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-Os
	-Iinclude
	-Wall
	-Wno-unused-function
	-DFW_VERSION=\"0.1.0\"
lib_ldf_mode = chain
lib_deps =
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^3.11.0
	beegee-tokyo/DHT sensor library for ESPx@^1.19

; ------------------------------------------------------------ module test apps
; One environment for all bring-up tests; the sketch is picked with the TEST
; variable (see scripts/select_test.py and scripts/test.sh):
;   TEST=soil pio run -e test -t upload -t monitor
[env:test]
extends = esp32
extra_scripts = pre:scripts/select_test.py

; ------------------------------------------------------------------ field node
;   pio run -e node -t upload -t monitor
[env:node]
extends = esp32
build_src_filter = -<*> +<node/>

; Whole node firmware on a bare ESP32: simulated flow and soil sensors.
[env:node-sim]
extends = env:node
build_flags = ${esp32.build_flags} -DSIM=1

; --------------------------------------------------------------------- gateway
; LoRa <-> MQTT bridge. Needs include/secrets.h (copy secrets.example.h).
[env:gateway]
extends = esp32
build_src_filter = -<*> +<gateway/>
lib_deps =
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.2.0

; ------------------------------------------------------------- host unit tests
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=gnu++17 -Wall
